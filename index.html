<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B2F6B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Amparo">
<meta name="description" content="App da Paróquia Nossa Senhora do Amparo: Evangelho do dia, Santo do dia, novenas, Bíblia e Pastoral do Dízimo.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
<title>Amparo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* App da Paróquia Nossa Senhora do Amparo. Claro, letras grandes (muitos leitores são idosos),
   azul-mariano dos cartazes da pastoral com detalhes dourados. Telas por hash: #inicio, #evangelho,
   #santo, #novenas, #novena/<id>, #biblia, #biblia/<livro>/<cap>, #pastoral. */
:root{
  --azul:#0B2F6B; --azul2:#1C4A93; --azulbg:#E9EFF9; --ouro:#B98A2E; --ouro2:#E3C27A; --creme:#FAF6EE; --papel:#FFFFFF;
  --tinta:#1B2233; --mudo:#5C6475; --fraco:#8D93A0; --linha:#E6E0D3; --linha2:#D3CBB9;
  --ok:#2F7A4F; --okbg:#E5F2EA; --espera:#9A6A12; --esperabg:#F7EDD6; --erro:#A3342B; --errobg:#F7E4E1;
  --disp:"Cormorant Garamond", Georgia, serif; --corpo:"Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --r:18px; --sombra:0 1px 2px rgba(20,30,60,.06), 0 6px 20px rgba(20,30,60,.07);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--creme)} body{background:transparent;color:var(--tinta)}
/* fundo: Nossa Senhora em azul e ouro (fixo, atrás de tudo; os cartões continuam legíveis por cima) */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:#fff url("img/fundo.jpg") center bottom/cover no-repeat;opacity:.38}
@media (min-width:700px){body::before{background-size:contain}}
body{margin:0;font-family:var(--corpo);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ouro2);outline-offset:2px}
a{color:var(--azul2)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* topo */
.topo{background:var(--azul);color:#fff;padding-top:env(safe-area-inset-top,0px);position:sticky;top:0;z-index:20}
.topo .wrap{display:flex;align-items:center;gap:12px;min-height:58px}
.topo .voltar{border:0;background:rgba(255,255,255,.12);color:#fff;width:40px;height:40px;border-radius:12px;font-size:22px;line-height:1;display:grid;place-items:center}
.topo h1{font-family:var(--disp);font-weight:700;font-size:23px;margin:0;line-height:1.1;flex:1;min-width:0}
.topo h1 small{display:block;font-family:var(--corpo);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ouro2)}
.selo{width:40px;height:40px;flex:none}

/* navegação de baixo */
.nav{position:fixed;inset:auto 0 0 0;z-index:30;background:var(--papel);border-top:1px solid var(--linha);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:flex;justify-content:space-around}
.nav button{flex:1;min-width:0;border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--fraco)}
.nav button svg{width:26px;height:26px}
.nav button[aria-current="page"]{color:var(--azul)}

/* telas */
.tela{padding:18px 0 28px}
.cartao{background:var(--papel);border-radius:var(--r);box-shadow:var(--sombra);padding:18px}
.titulo-sec{font-family:var(--disp);font-size:26px;font-weight:700;color:var(--azul);margin:26px 0 10px}
.mudo{color:var(--mudo)}
.pequeno{font-size:14px}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;background:var(--azul);color:#fff;font-size:16px}
.btn.claro{background:var(--azulbg);color:var(--azul)}
.btn.ouro{background:var(--ouro);color:#fff}
.btn:disabled{opacity:.55}
.campo{width:100%;border:1.5px solid var(--linha2);border-radius:14px;padding:12px 14px;background:#fff;font-size:17px}
.campo:focus{border-color:var(--azul2);outline:none}
textarea.campo{resize:vertical;min-height:96px}
.aviso{padding:12px 14px;border-radius:14px;background:var(--esperabg);color:var(--espera);font-size:15px}
.aviso.erro{background:var(--errobg);color:var(--erro)}
.carregando{color:var(--mudo);padding:24px 0;text-align:center}

body:has(.baixar-app:not([hidden])) .tela{padding-bottom:90px}
.popup-avisos{max-width:520px;padding:16px;max-height:88vh;overflow:auto}
.popup-avisos .rot{font-weight:800;color:var(--ouro);letter-spacing:.08em;text-transform:uppercase;font-size:13px}
.popup-avisos .avisos-semana{margin:10px 0 12px}
.notif{display:flex;align-items:center;gap:12px;background:var(--papel);border:1.5px solid var(--ouro2);border-radius:18px;padding:12px 12px 12px 14px;margin-top:16px;box-shadow:var(--sombra)}
.notif > span{font-size:26px}
.notif div{flex:1;min-width:0}
.notif b{display:block;font-size:15.5px;line-height:1.2}
.notif small{color:var(--mudo);font-size:13px}
.notif .btn{padding:10px 16px}

/* avisos da semana do 2º domingo */
.avisos-semana{display:grid;gap:12px;margin-top:14px}
.aviso-card{display:flex;gap:12px;background:var(--papel);border-radius:20px;padding:16px;box-shadow:var(--sombra);border-left:6px solid var(--azul2)}
.aviso-card.quilo{border-left-color:#2F7A4F}
.aviso-ic{font-size:30px;line-height:1}
.aviso-txt{flex:1;min-width:0}
.aviso-txt small{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ouro)}
.aviso-txt b{display:block;font-family:var(--disp);font-size:24px;color:var(--azul);line-height:1.15;margin:2px 0 4px}
.aviso-txt p{margin:0 0 8px;font-size:15.5px;color:var(--tinta)}
.aviso-txt blockquote{margin:0 0 10px;padding:8px 12px;background:#EEF6F0;border-radius:12px;font-family:var(--disp);font-style:italic;font-size:17px;color:#24533A}
.aviso-txt cite{display:block;font-family:var(--corpo);font-style:normal;font-size:13px;font-weight:700;margin-top:2px}

/* botão fixo "Baixar app" (some depois de instalado) */
.baixar-app{position:fixed;right:14px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:35;border:0;border-radius:999px;padding:12px 18px;
  background:var(--ouro);color:#fff;font-weight:800;font-size:15.5px;box-shadow:0 6px 18px rgba(0,0,0,.25)}

/* Inspiração do Padre */
.inspira{position:relative;background:linear-gradient(160deg,var(--azul) 0%,#123E86 70%,#1A4C9C 100%);color:#fff;border-radius:24px;padding:26px 22px 22px;overflow:hidden;box-shadow:0 10px 30px rgba(11,47,107,.25)}
.inspira::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(227,194,122,.35),transparent 70%)}
.inspira .rot{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ouro2);display:flex;align-items:center;gap:8px}
.inspira blockquote{margin:12px 0 14px;font-family:var(--disp);font-style:italic;font-weight:600;font-size:clamp(27px,7.2vw,38px);line-height:1.18;position:relative;z-index:1;text-wrap:balance}
.inspira .assin{font-weight:700;font-size:15px;color:#DCE5F5}
.editor{margin-top:14px;display:grid;gap:10px}
.editor .linha{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* botões grandes do início */
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.grande{border:0;text-align:left;background:var(--papel);border-radius:20px;box-shadow:var(--sombra);padding:16px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;position:relative;overflow:hidden}
.grande .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--azulbg);color:var(--azul)}
.grande .ic svg{width:28px;height:28px}
.grande b{font-size:19px;line-height:1.15;display:block}
.grande span{font-size:14px;color:var(--mudo);display:block;margin-top:3px;line-height:1.3}
.grande.largo{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:16px}
.grande.evang{background:linear-gradient(135deg,#FFF8E8,#FFFFFF 70%);border:1.5px solid #F0DFB4}
.grande.evang .ic{background:var(--ouro);color:#fff}
.grande.santo .foto{width:76px;height:76px;border-radius:50%;object-fit:cover;object-position:top;flex:none;border:3px solid var(--ouro2);background:var(--azulbg)}
.grande.pastoral{background:var(--azul);color:#fff}
.grande.pastoral span{color:#C9D6EE}
.grande.pastoral .ic{background:rgba(255,255,255,.14);color:var(--ouro2)}

/* aniversariantes do mês */
.aniv{margin-top:16px;background:var(--papel);border-radius:22px;box-shadow:var(--sombra);padding:20px 18px;position:relative;overflow:hidden}
.aniv::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:linear-gradient(90deg,var(--ouro),var(--ouro2),var(--azul2))}
.aniv h2{font-family:var(--disp);font-size:28px;color:var(--azul);margin:2px 0 4px;line-height:1.1}
.aniv .parab{margin:0 0 12px;color:var(--mudo);font-size:15.5px}
.aniv ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.aniv li{display:flex;align-items:baseline;gap:12px;padding:7px 4px;border-bottom:1px solid var(--linha)}
.aniv li:last-child{border-bottom:0}
.aniv li b{font-family:var(--disp);font-size:22px;color:var(--ouro);min-width:28px;text-align:right}
.aniv li.hoje{background:#FFF6DC;border-radius:12px;border-bottom-color:transparent;padding-inline:10px}
.aniv li.hoje > span::after{content:" 🎉 hoje!";font-weight:800;color:var(--ouro);font-size:14px}
.aniv li.passou{opacity:.55}
.aniv li.clicavel{cursor:pointer;flex-wrap:wrap}
.aniv li.clicavel span{text-decoration:underline;text-decoration-color:var(--ouro2);text-underline-offset:3px}
.aniv .parabens{flex-basis:100%;padding:8px 0 4px;font-size:15px;color:var(--mudo)}
.aniv .parabens .btn{width:100%;text-decoration:none;margin-top:8px}
.aniv .parabens textarea{font-size:15px;line-height:1.45;color:var(--tinta)}
.parabens-acoes{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
.aniv .mais{border:0;background:none;color:var(--azul2);font-weight:800;padding:10px 0 0}

/* acesso restrito */
.acesso{margin-top:34px;border-top:1px dashed var(--linha2);padding-top:18px}
.acesso form{display:flex;gap:10px}
.acesso .campo{width:100%;letter-spacing:.12em;text-align:center;padding-right:46px}
.pin-caixa{position:relative;display:block;flex:1;max-width:260px}
.olho{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mudo);width:40px;height:40px;display:grid;place-items:center;border-radius:10px}
.olho[aria-pressed="true"] .risco{display:none}

/* data */
.datas{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.datas button{border:0;background:var(--papel);box-shadow:var(--sombra);width:44px;height:44px;border-radius:14px;font-size:22px;color:var(--azul)}
.datas .d{text-align:center;font-weight:800}
.datas .d small{display:block;font-weight:600;color:var(--mudo);font-size:14px}
.cor{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:baseline;border:1px solid rgba(0,0,0,.15)}

/* leituras */
.abas{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.abas button{flex:none;border:1.5px solid var(--linha2);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px;color:var(--mudo)}
.abas button[aria-selected="true"]{background:var(--azul);border-color:var(--azul);color:#fff}
.leitura h2{font-family:var(--disp);font-size:28px;color:var(--azul);margin:0 0 2px;line-height:1.15}
.leitura .ref{font-weight:800;color:var(--ouro)}
.leitura .texto{font-size:19px;line-height:1.65;margin-top:12px;white-space:pre-line}
.leitura sup{font-size:.62em;color:var(--ouro);font-weight:800;margin-right:2px}
.refrao{background:var(--azulbg);border-radius:12px;padding:10px 14px;font-weight:700;color:var(--azul);margin-top:10px}
.fonte{font-size:13px;color:var(--fraco);margin-top:16px}
.tamanho{display:flex;gap:8px;justify-content:flex-end;margin-bottom:8px}
.tamanho button{border:1.5px solid var(--linha2);background:#fff;border-radius:10px;width:44px;height:36px;font-weight:800;color:var(--azul)}

/* santo */
.santo-top{text-align:center}
.santo-top .foto{width:min(260px,70vw);aspect-ratio:3/4;object-fit:cover;object-position:top;border-radius:22px;box-shadow:var(--sombra);border:4px solid #fff;background:var(--azulbg)}
.santo-top h2{font-family:var(--disp);font-size:34px;color:var(--azul);margin:14px 0 2px;line-height:1.1}
.santo-top .tit{color:var(--ouro);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:13px}
.historia{font-size:18px;line-height:1.65}
.historia p{margin:0 0 12px}

/* novenas */
.busca{position:relative}
.busca svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--fraco)}
.busca .campo{padding-left:46px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chips button{border:1.5px solid var(--linha2);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:15px;color:var(--mudo)}
.chips button[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);color:#fff}
.lista{display:grid;gap:10px}
.item{border:0;text-align:left;background:var(--papel);border-radius:16px;box-shadow:var(--sombra);padding:14px 16px;display:flex;align-items:center;gap:14px;width:100%}
.item .ini{width:44px;height:44px;border-radius:50%;background:var(--azulbg);color:var(--azul);display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:22px;flex:none}
.item b{display:block;font-size:17px;line-height:1.25}
.item span{display:block;font-size:14px;color:var(--mudo)}
.item .prog{margin-left:auto;font-size:13px;font-weight:800;color:var(--ok);flex:none}
.dias{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.dias button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--linha2);background:#fff;font-weight:800;color:var(--mudo);position:relative}
.dias button.feito{border-color:var(--ok);color:var(--ok)}
.dias button.feito::after{content:"✓";position:absolute;right:3px;top:0;font-size:11px}
.dias button[aria-current="true"]{background:var(--azul);border-color:var(--azul);color:#fff}
.oracao{margin-top:14px}
.oracao h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ouro);margin:0 0 6px}
.oracao p{margin:0;font-size:18px;line-height:1.65}
.oracao .medit{font-family:var(--disp);font-size:22px;line-height:1.4;color:var(--tinta)}

/* orações */
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.temas button{border:0;background:var(--papel);box-shadow:var(--sombra);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:108px}
.temas .emo{font-size:28px;line-height:1;margin-bottom:6px}
.temas b{font-size:16.5px;line-height:1.2}
.temas small{color:var(--mudo);font-size:13px}
.oracao-txt h2{font-family:var(--disp);font-size:30px;color:var(--azul);margin:0 0 4px;line-height:1.1}
.oracao-txt #txt{font-family:var(--disp);line-height:1.55;margin-top:14px}
.oracao-txt #txt p{margin:0 0 14px}

/* devocionários */
.devs{display:grid;gap:12px}
.devs button{border:0;text-align:left;border-radius:20px;padding:18px 18px 16px;color:#fff;background:linear-gradient(135deg,var(--cor),color-mix(in srgb,var(--cor) 70%,#000));box-shadow:var(--sombra);display:flex;flex-direction:column;gap:4px}
.devs b{font-family:var(--disp);font-size:27px;line-height:1.1}
.devs span{opacity:.88;font-size:15px}
.devs small{margin-top:6px;font-weight:800;color:var(--ouro2);font-size:13px;letter-spacing:.04em}
.dev-topo{border-radius:22px;padding:22px 20px;color:#fff;background:linear-gradient(150deg,var(--cor),color-mix(in srgb,var(--cor) 65%,#000))}
.dev-topo h2{font-family:var(--disp);font-size:32px;margin:0;line-height:1.1}
.dev-topo .sub{color:var(--ouro2);font-weight:800;margin-top:4px}
.dev-topo p{margin:12px 0 0;opacity:.92}
.indice{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.indice button{flex:none;border:1.5px solid var(--linha2);background:#fff;border-radius:999px;padding:7px 13px;font-weight:700;font-size:14px;color:var(--azul)}
.dev-sec{margin-top:14px}
.dev-sec h3{font-family:var(--disp);font-size:1.4em;color:var(--azul);margin:0 0 8px;line-height:1.15}
.dev-sec p{margin:0 0 12px;line-height:1.6}
.dev-sec .reza{font-family:var(--disp);font-size:1.12em}
.ladainha div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--linha)}
.ladainha em{color:var(--ouro);font-weight:700;font-style:italic;text-align:right;flex:none;max-width:45%}
.passo{border-top:1px solid var(--linha);padding:4px 0}
.passo summary{cursor:pointer;font-weight:800;padding:10px 0;color:var(--tinta)}
.passo[open] summary{color:var(--azul)}

/* pagar meu dízimo */
.diz-topo{background:linear-gradient(150deg,#8C6420,var(--ouro) 60%,#CFA453);color:#fff;border-radius:22px;padding:20px;box-shadow:var(--sombra)}
.diz-topo .rot{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.diz-topo p{font-family:var(--disp);font-style:italic;font-size:23px;line-height:1.25;margin:8px 0 4px}
.diz-topo small{font-weight:800;opacity:.9}
.diz-botoes{display:grid;gap:12px;margin-top:14px}
.grande.diz-pix{background:var(--azul);color:#fff}
.grande.diz-pix span{color:#C9D6EE}
.grande.diz-pix .ic{background:rgba(255,255,255,.14);color:var(--ouro2)}
.grande.dizimo-inicio{background:linear-gradient(135deg,#8C6420,var(--ouro));color:#fff;margin-top:14px;width:100%}
.grande.dizimo-inicio span{color:#FFF3D6}
.grande.dizimo-inicio .ic{background:rgba(255,255,255,.18);color:#fff}
.form{display:grid;gap:14px}
.form label{display:grid;gap:6px;font-weight:700;font-size:15.5px}
.form-tit{font-family:var(--disp);font-size:28px;color:var(--azul);margin:0;line-height:1.1}
.rotulo{display:block;font-weight:700;font-size:15.5px;margin-bottom:6px}
.anos,.meses{display:flex;gap:6px;flex-wrap:wrap}
.anos{margin-bottom:8px}
.meses{display:grid;grid-template-columns:repeat(4,1fr)}
.anos button,.meses button{border:1.5px solid var(--linha2);background:#fff;border-radius:12px;padding:9px 6px;font-weight:800;color:var(--mudo)}
.anos button[aria-pressed="true"],.meses button[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);color:#fff}
.campo.valor{font-size:22px;font-weight:800}
.grande-btn{width:100%;padding:16px;font-size:17px}
.pix{margin-top:16px;display:grid;gap:10px}

/* Pastoral do Dízimo: mural */

.vela .corpo{position:absolute;bottom:0;left:6px;width:34px;height:84px;border-radius:6px 6px 4px 4px;background:linear-gradient(90deg,#e9dcc0,#fffaf0 45%,#d8c9a6)}

.vela .chama{position:absolute;left:13px;width:20px;height:34px;bottom:90px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;
  background:radial-gradient(ellipse at 50% 75%,#fff 0%,#fff6b0 25%,#ffb300 55%,rgba(255,90,0,.0) 75%);filter:blur(.4px);transform-origin:50% 100%;animation:chama 1.4s ease-in-out infinite alternate}

@keyframes chama{0%{transform:scale(1,1) rotate(-2deg)}35%{transform:scale(.94,1.06) rotate(2deg)}70%{transform:scale(1.04,.95) rotate(-1deg)}100%{transform:scale(.97,1.04) rotate(1.5deg)}}
@keyframes halo{from{opacity:.6;transform:scale(.95)}to{opacity:1;transform:scale(1.06)}}

  background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.35),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(120,80,30,.25),transparent 55%),linear-gradient(180deg,#f3e2b8,#e6cc92 60%,#d9b877);

/* =====================================================================
   TEMA VIDRO 3D (nov/2026): cartões semitransparentes flutuando sobre a
   imagem de Nossa Senhora (azul e ouro). Paleta tirada da imagem.
   ===================================================================== */
:root{
  --azul3:#8FB3E0; --gelo:#CFE0F5; --ouroV:#E3B23C; --ouroE:#B98A2E;
  --vidro:rgba(255,255,255,.58); --vidro-forte:rgba(255,255,255,.80); --vidro-borda:rgba(255,255,255,.75);
  --desfoque:blur(16px) saturate(150%);
  --bisel:inset 0 1.5px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(11,47,107,.06);
  --flutua:0 14px 34px -10px rgba(11,47,107,.35), 0 3px 8px rgba(11,47,107,.10);
  --flutua2:0 22px 44px -12px rgba(11,47,107,.45), 0 6px 14px rgba(11,47,107,.14);
  --sombra:var(--bisel), var(--flutua);
}
html{background:linear-gradient(170deg,#E8EFF8 0%,#D9E5F4 45%,#C9D9EE 100%) fixed}
body::before{background:url("img/fundo.jpg") center bottom/cover no-repeat;opacity:.95;mix-blend-mode:multiply}
@media (min-width:700px){body::before{background-size:auto 100%;background-position:right 6% bottom}}

/* vidro: claro (texto escuro) */
.cartao,.item,.horarios,.ap,.aviso-card,.aniv,.notif,.temas button,.livros button,.caps button,.resultado,.peca,.anuncio,.cad,
.item-equipe,.datas button,.grande,.nota-nova,.acesso,.tamanho button,.indice button,.abas button,.chips button,.dias button,
.anos button,.meses button,.escolha-vela button,.aviso-novos{
  background:var(--vidro);-webkit-backdrop-filter:var(--desfoque);backdrop-filter:var(--desfoque);
  border:1px solid var(--vidro-borda);box-shadow:var(--sombra)}
.cartao,.leitura,.oracao-txt,.horarios,.aniv{background:var(--vidro-forte)}
.cartao{border-radius:24px}
.item,.resultado,.cad,.item-equipe,.peca,.anuncio{border-radius:20px}
.ap,.aviso-card{border-left-width:6px}
.campo{background:rgba(255,255,255,.86);border-color:rgba(28,74,147,.22);box-shadow:inset 0 1px 3px rgba(11,47,107,.08)}

  <div class="wrap">

    <button data-ir="dizimo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-3.8-6-8.5A3.5 3.5 0 0 1 12 10a3.5 3.5 0 0 1 6 2.5C18 17.2 12 21 12 21z"/><path d="M12 2v5M9.5 4.5h5"/></svg>Dízimo</button>
    <button data-ir="velas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1.8 2 2.5 3.4 2.5 4.6a2.5 2.5 0 0 1-5 0C9.5 5.4 10.2 4 12 2z"/><rect x="8.5" y="10" width="7" height="11" rx="1.2"/><path d="M6 21h12"/></svg>Velas</button>
    <button data-ir="tercos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.6"/><circle cx="17.5" cy="7.5" r="1.6"/><circle cx="19" cy="13" r="1.6"/><circle cx="6.5" cy="7.5" r="1.6"/><circle cx="5" cy="13" r="1.6"/><path d="M12 15v6M9.5 17.5h5"/></svg>Terços</button>
    <button id="navMenu" aria-label="Abrir menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menu</button>
  </div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbx8geB_A5kyUHsSYoqIcAZkzYzKfhTOQXHCcO3Irjho7aJX6OEwvWTLAFZKjqjX4hDMEg/exec';
const ASSINATURA = 'Pe. Allan Soriano';
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DIAS_SEM = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const CORES = {verde:'#2E8B57',roxo:'#6A3D9A',branco:'#FFFFFF',vermelho:'#C0392B',rosa:'#E89AB8',preto:'#222'};
const SANTO_PADRAO = "data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400"><rect width="300" height="400" fill="#E9EFF9"/><circle cx="150" cy="120" r="70" fill="none" stroke="#E3C27A" stroke-width="10"/><circle cx="150" cy="140" r="46" fill="#0B2F6B" opacity=".85"/><path d="M60 400c0-90 40-170 90-170s90 80 90 170z" fill="#0B2F6B" opacity=".85"/><path d="M150 270v80M125 295h50" stroke="#E3C27A" stroke-width="8" stroke-linecap="round"/></svg>');

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const guardar = (k, v) => { try { localStorage.setItem('amparo_'+k, JSON.stringify(v)); } catch(e){} };
const ler = (k, d) => { try { const v = localStorage.getItem('amparo_'+k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } };
const app = $('#app');

function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }

// ---------- servidor (Apps Script) ----------
const temServidor = () => /^https:\/\//.test(API_URL);
async function servidorGet(acao){
  if (!temServidor()) throw new Error('Servidor ainda não configurado');
  const r = await fetch(API_URL+'?acao='+acao); return r.json();
}
async function servidor(acao, dados={}){
  if (!temServidor()) throw new Error('Servidor ainda não configurado');
  const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({acao, pin: sessao.pin, ...dados})});
  const j = await r.json();
  if (!j.ok) throw new Error(j.erro || 'Erro');
  return j;
}

// ---------- sessão (PIN) ----------
let sessao = ler('sessao', {pin:'', papel:''});
const NOME_PAPEL = {padre: 'Padre', dizimo: 'Pastoral do Dízimo', pascom: 'Pascom'};
const ehDizimo = () => ['dizimo','padre'].includes(sessao.papel);
function atualizarNav(){
  $('#navPastoral').hidden = !sessao.papel;
  $('#latOla').textContent = sessao.papel ? 'Olá, ' + (NOME_PAPEL[sessao.papel] || sessao.papel) + '!' : 'Seja bem-vindo!';
}

// ---------- dados locais ----------
const cache = {};
async function carregar(nome){
  if (!cache[nome]) cache[nome] = fetch('dados/'+nome+'.json').then(r => { if(!r.ok) throw new Error('Arquivo '+nome); return r.json(); });
  try { return await cache[nome]; } catch(e){ delete cache[nome]; throw e; }
}

// ---------- rotas ----------
const rotas = {inicio:telaInicio, dizimo:telaDizimo, devocionarios:telaDevocionarios, oracoes:telaOracoes, oracao:telaOracao, evangelho:telaEvangelho, santo:telaSanto, novenas:telaNovenas, novena:telaNovena, biblia:telaBiblia, pastoral:telaPastoral,
  velas:telaVelas, tercos:telaTercos, confissao:telaConfissao, bazar:telaBazar, vitrine:telaVitrine};
function ir(h){ location.hash = h; }
function rota(){
  const [nome, ...args] = (location.hash.slice(1) || 'inicio').split('/').map(decodeURIComponent);
  const fn = rotas[nome] || telaInicio;
  const raiz = ['inicio','dizimo','biblia','velas','tercos','oracoes','pastoral'].includes(nome) && !args.length;
  $('#voltar').hidden = raiz; $('#selo').hidden = !raiz;
  document.querySelectorAll('.nav button[data-ir], .lat-itens button:not([data-rolar])').forEach(b => b.setAttribute('aria-current', b.dataset.ir === nome ? 'page' : 'false'));
  fecharMenu();
  if (nome === 'pastoral' && !sessao.papel) { ir('inicio'); return; }
  window.scrollTo(0,0);
  fn(...args);
}
function topo(sub, titulo){ $('#tituloTopo').innerHTML = `<small>${esc(sub)}</small>${esc(titulo)}`; }
window.addEventListener('hashchange', rota);
$('#voltar').onclick = () => history.length > 1 ? history.back() : ir('inicio');
document.querySelectorAll('.nav button[data-ir]').forEach(b => b.onclick = () => ir(b.dataset.ir));

// ---------- menu lateral (gaveta no celular, fixo no computador) ----------
function abrirMenu(){
  atualizarCartaoMenu();
  $('#lateral').classList.add('aberta'); $('#lateralFundo').hidden = false;
  $('#menuBtn').setAttribute('aria-expanded', 'true'); document.body.classList.add('menu-aberto');
  const atual = $('.lat-itens button[aria-current="page"]') || $('.lat-itens button'); if (atual) atual.focus({preventScroll:true});
}
function fecharMenu(){
  $('#lateral').classList.remove('aberta'); $('#lateralFundo').hidden = true;
  $('#menuBtn').setAttribute('aria-expanded', 'false'); document.body.classList.remove('menu-aberto');
}
function atualizarCartaoMenu(){
  const card = $('#latCard');
  if (precisaAtivar()) {
    $('#latCardIc').textContent = '🔔'; $('#latCardTit').textContent = 'Ativar avisos no celular'; $('#latCardTxt').textContent = 'Missas, confissões e recados da paróquia'; $('#latCardBtn').textContent = 'Ativar';
    $('#latCardBtn').onclick = async () => { $('#latCardBtn').disabled = true; if (await ativarNotificacoes()) { atualizarCartaoMenu(); cartaoNotificacoes(); } $('#latCardBtn').disabled = false; };
    card.hidden = false;
  } else if (!jaInstalado()) {
    $('#latCardIc').textContent = '📲'; $('#latCardTit').textContent = 'Baixar o app'; $('#latCardTxt').textContent = 'Tenha a paróquia na tela do celular'; $('#latCardBtn').textContent = 'Baixar';
    $('#latCardBtn').onclick = () => $('#btnInstalar').click();
    card.hidden = false;
  } else card.hidden = true;
}
$('#menuBtn').onclick = abrirMenu;
$('#navMenu').onclick = abrirMenu;
$('#latFechar').onclick = fecharMenu;
$('#lateralFundo').onclick = fecharMenu;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#lateral').classList.contains('aberta')) fecharMenu(); });
document.querySelectorAll('.lat-itens button').forEach(b => b.onclick = () => {
  const alvo = b.dataset.rolar;
  if (alvo && (location.hash.slice(1) || 'inicio') === 'inicio') fecharMenu(); else ir(b.dataset.ir);
  if (alvo) setTimeout(() => { const el = $('#'+alvo); const h = $('#horarios'); const destino = (el && el.innerHTML.trim()) ? el : (h && h.innerHTML.trim() ? h : el); if (destino) destino.scrollIntoView({behavior:'smooth', block:'start'}); }, 350);
});

// ---------- datas ----------
const hoje = () => { const d = new Date(); d.setHours(12,0,0,0); return d; };
const somaDias = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const chaveData = d => String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dataLonga = d => `${d.getDate()} de ${MESES[d.getMonth()].toLowerCase()}`;
const ehHoje = d => d.toDateString() === hoje().toDateString();
function seletorData(d, mudar){
  const div = document.createElement('div'); div.className = 'datas';
  div.innerHTML = `<button aria-label="Dia anterior">‹</button><div class="d">${ehHoje(d)?'Hoje':esc(DIAS_SEM[d.getDay()])}<small>${esc(dataLonga(d))} de ${d.getFullYear()}</small></div><button aria-label="Próximo dia">›</button>`;
  const [a,,p] = div.children; a.onclick = () => mudar(somaDias(d,-1)); p.onclick = () => mudar(somaDias(d,1));
  return div;
}

// ================= INÍCIO =================
async function telaInicio(){
  topo('Paróquia','Nossa Senhora do Amparo');
  const insp = ler('inspiracao', '');
  const podePascom = ['pascom','padre'].includes(sessao.papel);
  app.innerHTML = `<section class="tela">
    <div id="avisosPascom"></div>
    ${avisosDaSemana()}
    ${podePascom ? `<div class="cartao editor" style="margin:0 0 16px" id="edAviso">
      <b style="font-family:var(--disp);font-size:24px;color:var(--azul)">📣 Publicar aviso da paróquia</b>
      <div class="linha"><select class="campo" id="avCat" style="max-width:200px"><option value="aviso">🔔 Aviso</option><option value="missa">⛪ Missa</option><option value="confissao">🕊️ Confissão</option><option value="evento">🎉 Evento</option><option value="pastoral">🤝 Pastoral</option></select>
        <label class="pequeno mudo" style="display:flex;gap:6px;align-items:center">Mostrar até <input class="campo" id="avAte" type="date" style="width:auto;padding:8px"></label></div>
      <input class="campo" id="avTit" maxlength="90" placeholder="Título (ex.: Missa de Natal às 20h)">
      <textarea class="campo" id="avTxt" maxlength="900" placeholder="Texto do aviso"></textarea>
      <label class="aceite"><input type="checkbox" id="avNotif" checked> Avisar também no celular de quem ativou as notificações</label>
      <div class="linha"><button class="btn ouro" id="avPub">Publicar aviso</button><span class="mudo pequeno" id="avMsg"></span></div>
    </div>` : ''}
    <div class="inspira">
      <div class="rot"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.6 6.4L21 9l-5 4.4L17.5 20 12 16.6 6.5 20 8 13.4 3 9l6.4-.6z"/></svg>Inspiração do Padre</div>
      <blockquote id="inspTexto">${esc(insp || 'Vinde a mim, todos vós que estais cansados e sobrecarregados, e eu vos aliviarei.')}</blockquote>
      <div class="assin" id="inspAssin" ${insp ? '' : 'hidden'}>— ${esc(ASSINATURA)}</div>
    </div>
    ${sessao.papel === 'padre' ? `<div class="cartao editor" style="margin-top:12px">
      <label for="inspNova"><b>Nova inspiração</b> <span class="mudo pequeno">(aparece para todos no topo do app)</span></label>
      <textarea id="inspNova" class="campo" maxlength="600" placeholder="Escreva a frase de hoje, Padre…">${esc(insp)}</textarea>
      <div class="linha"><button class="btn ouro" id="inspSalvar">Publicar inspiração</button><span class="mudo pequeno" id="inspMsg"></span></div>
    </div>` : ''}
    <button class="grande largo dizimo-inicio" data-ir="dizimo"><div class="ic">${ICONE_PIX}</div><div><b>Pagar meu Dízimo</b><span>Pix do dízimo e da obra · cadastro de novo dizimista</span></div></button>
    <div class="grade">
      <button class="grande largo evang" data-ir="evangelho"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2z"/><path d="M22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg></div>
        <div><b>Evangelho do dia</b><span id="evPrev">${esc(dataLonga(hoje()))}</span></div></button>
      <button class="grande largo santo" data-ir="santo"><img class="foto" id="santoFoto" alt="" src="${SANTO_PADRAO}">
        <div><b>Santo do dia</b><span id="santoNome">Carregando…</span><span class="pequeno" style="color:var(--azul2);font-weight:700">Conhecer a história ›</span></div></button>
      <button class="grande" data-ir="velas"><div class="ic">🕯️</div><div><b>Acender uma vela</b><span>Deixe sua intenção de oração</span></div></button>
      <button class="grande" data-ir="tercos"><div class="ic">📿</div><div><b>Terços</b><span>Santo Terço, Misericórdia e outros</span></div></button>
      <button class="grande" data-ir="confissao"><div class="ic">🕊️</div><div><b>Confissão</b><span>Horários e exame de consciência</span></div></button>
      <button class="grande" data-ir="bazar"><div class="ic">🛍️</div><div><b>Bazar da paróquia</b><span>Veja as peças e reserve</span></div></button>
      <button class="grande largo vitrine" data-ir="vitrine"><div class="ic">🏪</div><div><b>Vitrine do Amparo</b><span>Comércios e serviços da nossa comunidade. Precisou? Compre de quem reza com você!</span></div></button>
      <button class="grande" data-ir="oracoes"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M10 5h4"/><path d="M8 21v-6.5a4 4 0 0 1 1.2-2.8L12 9l2.8 2.7a4 4 0 0 1 1.2 2.8V21"/><path d="M6 21h12"/></svg></div><div><b>Orações</b><span>Por tema e por santo</span></div></button>
      <button class="grande" data-ir="novenas"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="1.5"/><circle cx="17.5" cy="7" r="1.5"/><circle cx="19" cy="12.5" r="1.5"/><circle cx="6.5" cy="7" r="1.5"/><circle cx="5" cy="12.5" r="1.5"/><path d="M12 15v6M9.5 17.5h5"/></svg></div><div><b>Novenas</b><span>Santos e devoções</span></div></button>
      <button class="grande" data-ir="devocionarios"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M12 7v6M9.5 9.5h5"/><path d="M8 19h10"/></svg></div><div><b>Devocionários</b><span>Nossa Senhora, São José, Padre Pio…</span></div></button>
      <button class="grande" data-ir="biblia"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M12 7v5M9.5 9h5"/></svg></div><div><b>Bíblia</b><span>Ave-Maria</span></div></button>
      ${sessao.papel ? `<button class="grande largo pastoral" data-ir="pastoral"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/></svg></div><div><b>${sessao.papel === 'pascom' ? 'Área da Pascom' : 'Pastoral do Dízimo'}</b><span>${sessao.papel === 'pascom' ? 'Horários, vitrine e sugestões' : 'Mural, cartaz, bazar, vitrine e sugestões'}</span></div></button>` : ''}
    </div>
    <div id="cartaoAvisos"></div>
    <div id="horarios"></div>
    <section class="aniv" id="aniv" hidden></section>
    <div class="acesso">
      ${sessao.papel ? `<p class="mudo pequeno">Conectado como <b>${NOME_PAPEL[sessao.papel] || sessao.papel}</b>. <button class="btn claro" id="sair" style="padding:8px 14px;margin-left:6px">Sair</button></p>`
      : `<p class="mudo pequeno" style="margin:0 0 8px"><b>Acesso restrito</b> — Padre, Pastoral do Dízimo e Pascom</p>
         <form id="formPin"><span class="pin-caixa"><input class="campo" id="pin" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="40" placeholder="PIN" aria-label="PIN"><button type="button" class="olho" id="olho" aria-label="Mostrar PIN" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="risco" d="M4 4l16 16"/></svg></button></span><button class="btn">Entrar</button></form>
         <p class="pequeno" id="pinMsg" style="color:var(--erro);margin:8px 0 0"></p>`}
    </div>
  </section>`;
  app.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => ir(b.dataset.ir));
  popupAvisos();
  cartaoNotificacoes();
  conviteNotificacoes();
  desenhaAvisosPascom(ler('avisosPascom', []));
  desenhaHorarios(ler('horarios', []));
  const avPub = $('#avPub');
  if (avPub) avPub.onclick = async () => {
    const titulo = $('#avTit').value.trim(); if (!titulo) return toast('Escreva o título do aviso');
    avPub.disabled = true; $('#avMsg').textContent = 'Publicando…';
    try {
      const j = await servidor('aviso', {titulo, texto: $('#avTxt').value.trim(), categoria: $('#avCat').value, ate: $('#avAte').value, notificar: $('#avNotif').checked, autor: NOME_PAPEL[sessao.papel]});
      guardar('avisosPascom', j.avisos); desenhaAvisosPascom(j.avisos); $('#avTit').value = ''; $('#avTxt').value = ''; $('#avMsg').textContent = 'Publicado!';
      toast($('#avNotif').checked ? 'Aviso publicado. Ele chega no celular dos fiéis em até 1 hora.' : 'Aviso publicado');
    } catch(e){ $('#avMsg').textContent = e.message; }
    avPub.disabled = false;
  };

  const olho = $('#olho');
  if (olho) olho.onclick = () => { const ver = $('#pin').type === 'password'; $('#pin').type = ver ? 'text' : 'password';
    olho.setAttribute('aria-pressed', ver); olho.setAttribute('aria-label', ver ? 'Esconder PIN' : 'Mostrar PIN'); $('#pin').focus(); };
  const f = $('#formPin');
  if (f) f.onsubmit = async ev => {
    ev.preventDefault(); const pin = $('#pin').value.trim(); if (!pin) return;
    $('#pinMsg').textContent = 'Conferindo…';
    try { sessao = {pin}; const j = await servidor('entrar'); sessao = {pin, papel:j.papel}; guardar('sessao', sessao); atualizarNav(); toast(j.papel === 'padre' ? 'Bem-vindo, Padre!' : 'Bem-vindo(a), ' + NOME_PAPEL[j.papel] + '!'); telaInicio(); }
    catch(e){ sessao = {pin:'',papel:''}; $('#pinMsg').textContent = e.message; }
  };
  const s = $('#sair'); if (s) s.onclick = () => { sessao = {pin:'',papel:''}; guardar('sessao', sessao); atualizarNav(); telaInicio(); };
  const salvar = $('#inspSalvar');
  if (salvar) salvar.onclick = async () => {
    const texto = $('#inspNova').value.trim(); salvar.disabled = true; $('#inspMsg').textContent = 'Publicando…';
    try { const j = await servidor('inspiracao', {texto}); guardar('inspiracao', j.inspiracao); $('#inspTexto').textContent = j.inspiracao || 'Vinde a mim, todos vós que estais cansados e sobrecarregados, e eu vos aliviarei.'; $('#inspAssin').hidden = !j.inspiracao; $('#inspMsg').textContent = 'Publicada!'; toast('Inspiração publicada'); }
    catch(e){ $('#inspMsg').textContent = e.message; }
    salvar.disabled = false;
  };

const TIPOS_HORARIO = ['Missa','Confissão','Adoração','Terço','Secretaria'];

  const el = $('#horarios'); if (!el) return;

    el.innerHTML = `<div class="horarios"><h2>Editar horários</h2><div id="hLinhas">${(lista.length ? lista : [{tipo:'Missa'}]).map(linha).join('')}</div>

      const nova = [...el.querySelectorAll('.hed')].map(d => { const [t, a, b, c] = d.querySelectorAll('select,input'); return {tipo: t.value, dia: a.value.trim(), hora: b.value.trim(), obs: c.value.trim()}; }).filter(h => h.dia || h.hora);

function chaveVapid(b64){ const p = '='.repeat((4 - b64.length % 4) % 4); const r = atob((b64 + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, c => c.charCodeAt(0)); }

async function telaNovena(id, diaStr){
  const nov = await carregar('novenas'); const n = nov.find(x => x.id === id);
  if (!n) { ir('novenas'); return; }
  topo('Novena', n.nome.replace(/^Novena (a|ao|à|de|do|da)\s+/i,''));
  const prog = ler('progNov', {}); const feitos = prog[id] || [];
  const dia = Math.min(9, Math.max(1, +diaStr || (feitos.length ? Math.min(9, Math.max(...feitos)+1) : 1)));
  const D = n.dias[dia-1];
  app.innerHTML = `<section class="tela">
    <div class="cartao"><h2 style="font-family:var(--disp);color:var(--azul);font-size:30px;margin:0;line-height:1.1">${esc(n.nome)}</h2>
      <p class="mudo pequeno" style="margin:4px 0 10px;font-weight:700">${esc(n.festa||'')}</p><p style="margin:0">${esc(n.sobre||'')}</p></div>
    <div class="dias">${n.dias.map((_,i)=>`<button class="${feitos.includes(i+1)?'feito':''}" aria-current="${i+1===dia}" data-d="${i+1}">${i+1}º</button>`).join('')}</div>
    <div class="cartao">
      <div class="oracao" style="margin-top:0"><h3>Oração inicial</h3><p>${esc(n.inicial)}</p></div>
      <div class="oracao"><h3>${dia}º dia · ${esc(D.tema)}</h3><p class="medit">${esc(D.reflexao)}</p></div>
      <div class="oracao"><h3>Oração do dia</h3><p>${esc(D.oracao)}</p></div>
      <div class="oracao"><h3>Oração final</h3><p>${esc(n.final)}</p></div>
      ${n.rezar ? `<div class="oracao"><h3>Rezar</h3><p>${esc(n.rezar)}</p></div>` : ''}
    </div>
    <div class="passa"><button class="btn claro" id="ant" ${dia===1?'disabled':''}>‹ ${dia-1||1}º dia</button>
      <button class="btn" id="feito">${feitos.includes(dia) ? (dia<9?'Ir para o '+(dia+1)+'º dia':'Novena concluída ✓') : 'Rezei o '+dia+'º dia ✓'}</button></div>
    ${feitos.length ? '<p style="text-align:center"><button class="btn claro pequeno" id="zerar" style="padding:8px 14px">Recomeçar novena</button></p>' : ''}
  </section>`;
  app.querySelectorAll('.dias button').forEach(b => b.onclick = () => ir(`novena/${id}/${b.dataset.d}`));
  $('#ant').onclick = () => ir(`novena/${id}/${dia-1}`);
  $('#feito').onclick = () => {
    if (!feitos.includes(dia)) { prog[id] = [...feitos, dia]; guardar('progNov', prog); }
    if (dia < 9) ir(`novena/${id}/${dia+1}`); else { toast('Novena concluída. Deus abençoe!'); telaNovena(id, 9); }
  };
  const z = $('#zerar'); if (z) z.onclick = () => { delete prog[id]; guardar('progNov', prog); ir(`novena/${id}/1`); };
}

// PIX = {dizimo:{chave}, obra:{chave}, recebedor, cidade, whatsapp} vem de app/config.json (montado pelo build).

const TIPOS_PIX = {
  dizimo: {titulo: 'Pagar dízimo', sub: 'Devolva seu dízimo pelo Pix', txid: 'DIZIMO', descr: 'Dizimo',
    frase: 'efetuei o pagamento do meu dízimo pelo Pix', fecho: 'Que Deus abençoe a nossa paróquia e todos os dizimistas!'},
  obra: {titulo: 'Contribuir com a obra', sub: 'Ajude nas obras da paróquia', txid: 'OBRA', descr: 'Obra',
    frase: 'efetuei pelo Pix a minha contribuição para a obra da paróquia', fecho: 'Que Deus abençoe a obra e toda a nossa comunidade!'},
};
const semAcento = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\x20-\x7E]/g, '');
const campoPix = (id, v) => id + String(v.length).padStart(2, '0') + v;
function crc16(s){
  let c = 0xFFFF;
  for (let i = 0; i < s.length; i++) { c ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; }
  return c.toString(16).toUpperCase().padStart(4, '0');
}
function codigoPix(chave, valor, txid, descricao){
  const conta = campoPix('00', 'br.gov.bcb.pix') + campoPix('01', chave) + (descricao ? campoPix('02', semAcento(descricao).slice(0, 40)) : '');
  const corpo = campoPix('00', '01') + campoPix('26', conta) + campoPix('52', '0000') + campoPix('53', '986') +
    campoPix('54', valor.toFixed(2)) + campoPix('58', 'BR') +
    campoPix('59', semAcento(PIX.recebedor).toUpperCase().slice(0, 25)) + campoPix('60', semAcento(PIX.cidade).toUpperCase().slice(0, 15)) +
    campoPix('62', campoPix('05', (semAcento(txid).replace(/[^A-Za-z0-9]/g, '') || '***').slice(0, 25))) + '6304';
  return corpo + crc16(corpo);
}
const reais = v => v.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
const lerValor = t => { const n = Number(String(t).replace(/[^\d,.]/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.')); return isFinite(n) ? Math.round(n * 100) / 100 : 0; };
function listaMeses(sel){ // [{m, a}] → "outubro e novembro de 2026"
  const porAno = {}; sel.forEach(({m, a}) => (porAno[a] = porAno[a] || []).push(m));
  const junta = l => l.length > 1 ? l.slice(0, -1).join(', ') + ' e ' + l[l.length - 1] : l[0];
  return junta(Object.keys(porAno).sort().map(a => junta(porAno[a].sort((x, y) => x - y).map(m => MESES[m - 1].toLowerCase())) + ' de ' + a));
}

// a leitura abre no site Bíblia Católica Online, direto no capítulo ou versículo (decisão do Ramon, 05/11/2026).
let biblia = null;
async function abrirBiblia(){
  if (biblia) return biblia;
  const b = await carregar('biblia');
  b.livros.forEach(l => { l.k = norm(l.nome).replace(/\s/g,''); l.ka = norm(l.abrev).replace(/\s/g,''); });
  return biblia = b;
}
function acharLivro(txt){
  let t = norm(txt).replace(/[\s.]/g,'');
  if (/^salmos?$/.test(t)) t = 'sl';
  return biblia.livros.find(l => l.ka === t || l.k === t) || (t.length >= 3 && biblia.livros.find(l => l.k.startsWith(t) || l.k.replace(/^\d/,'').startsWith(t)));
}
const linkAveMaria = (l, c, v) => `${biblia.link}${l.id}/${c}/${v ? v+'/' : ''}`;
function lerNaAveMaria(l, c, v){
  guardar('ultimaLeitura', {livro:l.id, cap:c});
  window.open(linkAveMaria(l, c, v), '_blank', 'noopener');
}

function abrirCapitulo(l, c, v){ if (temComentario(l, c)) ir(`biblia/${l.id}/${c}`); else lerNaAveMaria(l, c, v); }

// fotos reduzidas no próprio celular antes de subir (até 1000 px, JPEG)
function reduzirFoto(arq){
  return new Promise((ok, erro) => { const img = new Image(), url = URL.createObjectURL(arq);
    img.onload = () => { const max = 1000, k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', .82).split(',')[1]); };
    img.onerror = () => { URL.revokeObjectURL(url); erro(new Error('Não consegui ler a foto')); }; img.src = url; });
}

// A arte fica privada no Drive da pastoral; o servidor só a entrega para quem entrou com PIN.
async function verArte(botao){
  const txt = botao.textContent; botao.disabled = true; botao.textContent = 'Carregando…';
  try {
    const j = await servidor('arteCartaz', {id: botao.dataset.id});
    const bin = atob(j.base64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const blob = new Blob([bytes], {type: j.tipo || 'image/jpeg'}), url = URL.createObjectURL(blob);
    const arquivo = new File([blob], j.nome, {type: blob.type});
    const podeCompartilhar = navigator.canShare && navigator.canShare({files: [arquivo]});
    const fundo = document.createElement('div'); fundo.className = 'arte-fundo';
    fundo.innerHTML = `<div class="arte-caixa" role="dialog" aria-label="Cartaz dos aniversariantes">
      <img src="${url}" alt="Cartaz dos aniversariantes">
      <div class="arte-botoes"><a class="btn ouro" href="${url}" download="${esc(j.nome)}">Baixar</a>
        ${podeCompartilhar ? '<button class="btn" id="arteComp">Compartilhar</button>' : ''}
        <button class="btn claro" id="arteFechar">Fechar</button></div>
      <p class="pequeno mudo" style="margin:8px 0 0;text-align:center">Imagem em alta resolução, pronta para imprimir em A4 deitado.</p></div>`;
    document.body.appendChild(fundo);
    const fechar = () => { fundo.remove(); URL.revokeObjectURL(url); };
    fundo.onclick = e => { if (e.target === fundo) fechar(); };
    $('#arteFechar').onclick = fechar;
    const c = $('#arteComp'); if (c) c.onclick = () => navigator.share({files: [arquivo], title: 'Cartaz dos aniversariantes'}).catch(() => {});
  } catch(e){ toast(e.message); }
  botao.disabled = false; botao.textContent = txt;
}

// ================= TELA DE ENTRADA com pontos 3D (mesmo motor do site novo do GDC) =================
// Aparecida → formas geométricas 3D → Nossa Senhora do Amparo, em loop. As figuras vêm de img/aparecida.png e
// img/amparo.png (silhueta escura sobre fundo branco); sem elas, ficam só as formas.
function pontos3D(cv, legenda){
  const N = 3200, TAU = Math.PI * 2, ctx = cv.getContext('2d');
  const esfera = () => { const o = [], g = Math.PI * (3 - Math.sqrt(5)); for (let i = 0; i < N; i++) { const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), t = g * i; o.push([Math.cos(t) * r * .85, y * .85, Math.sin(t) * r * .85]); } return o; };
  const anel = () => { const o = [], a = Math.ceil(Math.sqrt(N * 3)), b = Math.ceil(N / a); for (let i = 0; i < a; i++) for (let j = 0; j < b && o.length < N; j++) { const u = i / a * TAU, v = j / b * TAU, R = .68, r = .26; o.push([(R + r * Math.cos(v)) * Math.cos(u), r * Math.sin(v), (R + r * Math.cos(v)) * Math.sin(u)]); } while (o.length < N) o.push(o[o.length % a]); return o; };
  const cubo = () => { const o = [], k = Math.ceil(Math.sqrt(N / 6)) + 1, f = []; for (let i = 0; i < k; i++) for (let j = 0; j < k; j++) { const a = -1 + 2 * i / (k - 1), b = -1 + 2 * j / (k - 1); f.push([a, b, 1], [a, b, -1], [a, 1, b], [a, -1, b], [1, a, b], [-1, a, b]); } for (let i = 0; i < N; i++) { const p = f[Math.floor(i * f.length / N)]; o.push([p[0] * .6, p[1] * .6, p[2] * .6]); } return o; };
  const estrela = () => { const o = []; for (let i = 0; i < N; i++) { const k = i % 10, a1 = k * Math.PI / 5 - Math.PI / 2, a2 = (k + 1) * Math.PI / 5 - Math.PI / 2, r1 = k % 2 ? .38 : .9, r2 = k % 2 ? .9 : .38, t = (i * 0.618) % 1, q = Math.sqrt(((i * 0.381) % 1)); const x = (Math.cos(a1) * r1 * (1 - t) + Math.cos(a2) * r2 * t) * q, y = (Math.sin(a1) * r1 * (1 - t) + Math.sin(a2) * r2 * t) * q; o.push([x, y, ((i % 5) / 4 - .5) * .3]); } return o; };
  // figura: pontos sorteados nos pixels escuros da silhueta, em duas camadas (frente e trás), como o "S" do GDC
  const daImagem = src => new Promise(ok => { const im = new Image(); im.onload = () => {
      const T = 300, c = document.createElement('canvas'); c.width = c.height = T; const g = c.getContext('2d', {willReadFrequently: true});
      const k = Math.min(T / im.width, T / im.height); g.fillStyle = '#fff'; g.fillRect(0, 0, T, T); g.drawImage(im, (T - im.width * k) / 2, (T - im.height * k) / 2, im.width * k, im.height * k);
      const d = g.getImageData(0, 0, T, T).data, escuro = (x, y) => x >= 0 && y >= 0 && x < T && y < T && (d[(y * T + x) * 4] < 140);
      // contornos (escuro encostado no branco) recebem a maior parte dos pontos: assim aparecem rosto, coroa, Menino e manto
      const borda = [], miolo = [];
      for (let y = 0; y < T; y++) for (let x = 0; x < T; x++) { if (!escuro(x, y)) continue;
        const b = !escuro(x + 1, y) || !escuro(x - 1, y) || !escuro(x, y + 1) || !escuro(x, y - 1); (b ? borda : (x + y) % 3 ? null : miolo)?.push([x / T * 2 - 1, y / T * 2 - 1]); }
      if (borda.length < 150) return ok(null);
      const o = [], nb = Math.round(N * .72);
      for (let i = 0; i < N; i++) { const l = i < nb ? borda : (miolo.length ? miolo : borda), p = l[Math.floor(((i < nb ? i : i - nb) * 0.6180339 % 1) * l.length)];
        o.push([p[0] * .97, p[1] * .97, i < nb ? (i % 2 ? .05 : -.05) : (i % 2 ? .14 : -.14)]); }
      ok(o); }; im.onerror = () => ok(null); im.src = src; });
  const brilho = Array.from({length: N}, (_, i) => (i * 7919) % 13 === 0); // algumas faíscas douradas
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const MUDA = 1500;
  let CENAS = [{f: esfera(), nome: '', parado: 2600}], w = 0, h = 0, dpr = 1, raf = 0, parar = false;
  let atual = 0, tCena = performance.now();
  Promise.all([daImagem('img/aparecida.png'), daImagem('img/amparo.png')]).then(([ap, am]) => {
    const formas = [{f: esfera(), nome: '', parado: 2200}, {f: anel(), nome: '', parado: 2200}, {f: cubo(), nome: '', parado: 2200}, {f: estrela(), nome: '', parado: 2200}];
    CENAS = [];
    if (ap) CENAS.push({f: ap, nome: 'Nossa Senhora Aparecida', parado: 4200, figura: true});
    CENAS.push(...formas);
    if (am) CENAS.push({f: am, nome: 'Nossa Senhora do Amparo', parado: 4800, figura: true});
    tCena = performance.now(); atual = 0; mostraNome();
  });
  const mostraNome = () => { if (!legenda) return; legenda.style.opacity = 0; setTimeout(() => { legenda.textContent = CENAS[atual].nome || ''; legenda.style.opacity = 1; }, 350); };
  const medir = () => { dpr = Math.min(2, window.devicePixelRatio || 1); w = cv.clientWidth; h = cv.clientHeight; cv.width = w * dpr; cv.height = h * dpr; };
  medir(); addEventListener('resize', medir);
  const t0 = performance.now();
  const desenhar = agora => {
    const A = CENAS[atual], B = CENAS[(atual + 1) % CENAS.length], dentro = agora - tCena;
    if (dentro > A.parado + MUDA) { atual = (atual + 1) % CENAS.length; tCena = agora; mostraNome(); return desenhar(agora); }
    const k = dentro < A.parado ? 0 : ease((dentro - A.parado) / MUDA), a = A.f, b = B.f;
    const el = agora - t0, figura = A.figura && k < .5 || B.figura && k >= .5;
    // as santas só balançam um pouco (para continuarem reconhecíveis); as formas giram mais
    const ry = Math.sin(el / 1500) * (figura ? .45 : .95), rx = Math.sin(el / 2300) * .2;
    const cy = Math.cos(ry), sy = Math.sin(ry), cx = Math.cos(rx), sx = Math.sin(rx);
    const esc = Math.min(w, h) * .45, ox = w / 2, oy = h / 2;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    const sopro = Math.sin(k * Math.PI) * .2, pts = new Array(N);
    for (let i = 0; i < N; i++) {
      let x = a[i][0] + (b[i][0] - a[i][0]) * k, y = a[i][1] + (b[i][1] - a[i][1]) * k, z = a[i][2] + (b[i][2] - a[i][2]) * k;
      x *= 1 + sopro; y *= 1 + sopro; z *= 1 + sopro;
      const x1 = x * cy + z * sy, z1 = -x * sy + z * cy, y1 = y * cx - z1 * sx, z2 = y * sx + z1 * cx, p = 2.6 / (2.6 + z2);
      pts[i] = [ox + x1 * esc * p, oy + y1 * esc * p, z2, i];
    }
    pts.sort((p, q) => q[2] - p[2]);
    for (const [px, py, z, i] of pts) {
      const prof = (1 - z) / 2, r = (figura ? .45 + prof * .7 : .6 + prof * 1.1) * (esc / 95);
      ctx.globalAlpha = .45 + prof * .55;
      ctx.fillStyle = brilho[i] ? '#FFF4CC' : figura ? (prof > .5 ? '#F3D58A' : '#BFD6F5') : prof > .62 ? '#E3B23C' : prof > .38 ? '#8FB3E0' : '#4F7BC4';
      ctx.beginPath(); ctx.arc(px, py, r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  };
  const quadro = agora => { raf = 0; if (parar || !cv.isConnected) return; if (!document.hidden && cv.offsetParent !== null) desenhar(agora); raf = requestAnimationFrame(quadro); };
  raf = requestAnimationFrame(quadro);
  return () => { parar = true; removeEventListener('resize', medir); };
}

// tutorial animado: como instalar no iPhone (Safari → Compartilhar → Adicionar à Tela de Início → Adicionar)
function tutorialIphone(){
  const j = janela(`<div class="tut"><h2>Instalar no iPhone</h2><p class="mudo" style="margin:0">Abra este app no <b>Safari</b> e siga os passos:</p>
    <div class="iphone"><div class="tela-i"><div class="site"></div>
      <div class="barra"><span>‹</span><span>›</span><span class="comp">⬆︎</span><span>📖</span><span>⧉</span></div>
      <div class="folha" id="tFolha"><div>Copiar <span>⧉</span></div><div>Adicionar aos Favoritos <span>☆</span></div><div class="alvo">Adicionar à Tela de Início <span>⊞</span></div><div>Imprimir <span>🖨</span></div></div>
      <div class="add" id="tAdd"><span class="ok" id="tOk">Adicionar</span><img src="${esc($('#entLogo').src)}" alt=""><b>App Amparo</b><span>Ícone na tela de início</span></div>
      <div class="pulso" id="tPulso"></div><div class="dedo" id="tDedo">👆</div></div></div>
    <p class="passo-txt" id="tTxt"></p><div class="bolinhas" id="tBol"><i></i><i></i><i></i><i></i></div>
    <button class="btn ouro grande-btn" id="tFechar" style="margin-top:14px">Entendi</button></div>`);
  j.style.zIndex = 120;
  const P = [
    {txt: '1. Toque no botão Compartilhar (quadrado com seta para cima), embaixo da tela.', x: 100, y: 352},
    {txt: '2. Na lista, toque em "Adicionar à Tela de Início".', x: 150, y: 205},
    {txt: '3. Toque em "Adicionar", no canto de cima.', x: 170, y: 20},
    {txt: '4. Pronto! O App Amparo fica na tela do seu iPhone, como um aplicativo. 🙏', x: 100, y: 200},
  ];
  let k = 0;
  const mostra = () => { if (!document.body.contains(j)) return;
    const p = P[k], dedo = j.querySelector('#tDedo'), pulso = j.querySelector('#tPulso');
    j.querySelector('#tTxt').textContent = p.txt; [...j.querySelector('#tBol').children].forEach((b, i) => b.classList.toggle('on', i === k));
    j.querySelector('#tFolha').style.bottom = k === 1 ? '52px' : '-230px';
    j.querySelector('#tAdd').style.display = k >= 2 ? 'flex' : 'none';
    j.querySelector('#tOk').style.background = k === 2 ? '#E8F0FE' : 'none';
    dedo.style.opacity = k === 3 ? 0 : 1; dedo.style.left = (p.x - 12) + 'px'; dedo.style.top = (p.y + 6) + 'px';
    pulso.style.display = k === 3 ? 'none' : 'block'; pulso.style.left = (p.x - 22) + 'px'; pulso.style.top = (p.y - 22) + 'px';
    k = (k + 1) % P.length; setTimeout(mostra, 2800); };
  mostra();
  j.querySelector('#tFechar').onclick = () => j.remove();
}

// abre a cada vez que o app é aberto (uma vez por sessão do navegador)
function telaEntrada(){
  const el = $('#entrada');
  try { if (sessionStorage.getItem('amparo_entrou')) return; } catch(e){}
  el.hidden = false; document.body.style.overflow = 'hidden';
  const pararAnim = pontos3D($('#pontos3d'), $('#legEnt'));
  const sair = () => { try { sessionStorage.setItem('amparo_entrou', '1'); } catch(e){}
    el.classList.add('saindo'); document.body.style.overflow = '';
    setTimeout(() => { el.hidden = true; pararAnim(); conviteNotificacoes(); }, 500); };
  $('#entEntrar').onclick = sair;
  const b = $('#entBaixar'); b.hidden = jaInstalado();
  b.onclick = async () => {
    if (pedidoInstalacao) { pedidoInstalacao.prompt(); const r = await pedidoInstalacao.userChoice; pedidoInstalacao = null; if (r.outcome === 'accepted') { guardar('instalado', true); b.hidden = true; } }
    else if (ehIphone()) tutorialIphone();
    else alert('Para instalar:\n\n1. Toque nos três pontinhos ⋮ do navegador (no alto, à direita).\n2. Escolha "Instalar app" ou "Adicionar à tela inicial".\n3. Confirme.');
  };
  if (sessao.papel) $('#entPin').placeholder = 'Conectado: ' + NOME_PAPEL[sessao.papel];
  $('#entForm').onsubmit = async ev => {
    ev.preventDefault(); const pin = $('#entPin').value.trim(); if (!pin) return;
    $('#entMsg').style.color = '#C9D6EE'; $('#entMsg').textContent = 'Conferindo…';
    try { sessao = {pin}; const j = await servidor('entrar'); sessao = {pin, papel: j.papel}; guardar('sessao', sessao); atualizarNav();
      toast('Bem-vindo(a), ' + NOME_PAPEL[j.papel] + '!'); sair(); rota(); }
    catch(e){ sessao = ler('sessao', {pin:'', papel:''}); $('#entMsg').style.color = '#FFB4A8'; $('#entMsg').textContent = e.message; }
  };
}

atualizarNav();
rota();
telaEntrada();
